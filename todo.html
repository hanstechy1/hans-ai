<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>To-Do List</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        #taskList { list-style: none; padding: 0; }\n        li { display: flex; justify-content: space-between; margin: 10px 0; }\n    </style>\n</head>\n<body>\n    <h1>My To-Do List</h1>\n    <input type="text" id="taskInput" placeholder="Add a new task...">\n    <button id="addTaskBtn">Add Task</button>\n    <ul id="taskList"></ul>\n\n    <script>\n        const taskInput = document.getElementById('taskInput');\n        const addTaskBtn = document.getElementById('addTaskBtn');\n        const taskList = document.getElementById('taskList');\n        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];\n\n        function renderTasks() {\n            taskList.innerHTML = '';\n            tasks.forEach((task, index) => {\n                const li = document.createElement('li');\n                li.innerHTML = `<span${task.completed ? ' style="text-decoration: line-through"' : ''}>${task.text}</span> <button onclick="deleteTask(${index})">Delete</button> <button onclick="completeTask(${index})">${task.completed ? 'Undo' : 'Complete'}</button>`;\n                taskList.appendChild(li);\n            });\n        }\n\n        function addTask() {\n            const taskText = taskInput.value;\n            if (taskText) {\n                tasks.push({ text: taskText, completed: false });\n                localStorage.setItem('tasks', JSON.stringify(tasks));\n                taskInput.value = '';\n                renderTasks();\n            }\n        }\n\n        function deleteTask(index) {\n            tasks.splice(index, 1);\n            localStorage.setItem('tasks', JSON.stringify(tasks));\n            renderTasks();\n        }\n\n        function completeTask(index) {\n            tasks[index].completed = !tasks[index].completed;\n            localStorage.setItem('tasks', JSON.stringify(tasks));\n            renderTasks();\n        }\n\n        addTaskBtn.addEventListener('click', addTask);\n        renderTasks();\n    <\/script>\n</body>\n</html>
